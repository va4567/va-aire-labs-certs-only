apiVersion: apps/v1
kind: Deployment
metadata:
  name: a2a-agent
  namespace: kagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: a2a-agent
  template:
    metadata:
      labels:
        app: a2a-agent
    spec:
      containers:
        - name: agent
          image: ghcr.io/PLACEHOLDER_USER/a2a-agent:v1
          env:
            - name: AGENT_URL
              value: "http://a2a-agent.kagent.svc.cluster.local:8000"
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: a2a-agent
  namespace: kagent
spec:
  selector:
    app: a2a-agent
  ports:
    - port: 8000
      targetPort: 8000